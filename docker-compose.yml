services:
  postgres:
    image: postgres:17-alpine
    container_name: republik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-republik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-republik_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-republik_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - republik_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-republik} -d ${POSTGRES_DB:-republik_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./republik-backend
      dockerfile: Dockerfile
    container_name: republik-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3001}
      API_PREFIX: ${API_PREFIX:-api}
      BODY_LIMIT: ${BODY_LIMIT:-12mb}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-republik}:${POSTGRES_PASSWORD:-republik_secret_2026}@postgres:5432/${POSTGRES_DB:-republik_db}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      DB_AUTO_SEED: ${DB_AUTO_SEED:-true}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Republik@2026}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@republik.com.br}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Super Admin Republik}
      SEED_ADMIN_WHATSAPP: ${SEED_ADMIN_WHATSAPP:-+55 (11) 99999-0000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-republik-super-secret-access-key-2026-lgpd}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-republik-super-secret-refresh-key-2026-lgpd}
      CSRF_SECRET: ${CSRF_SECRET:-republik-csrf-double-submit-secret-2026}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
      EXPOSE_DEMO_OTP: ${EXPOSE_DEMO_OTP:-true}
      COOKIE_ACCESS_NAME: ${COOKIE_ACCESS_NAME:-republik_access_token}
      COOKIE_REFRESH_NAME: ${COOKIE_REFRESH_NAME:-republik_refresh_token}
      COOKIE_CSRF_NAME: ${COOKIE_CSRF_NAME:-republik_csrf_token}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      THROTTLE_DEFAULT_TTL_MS: ${THROTTLE_DEFAULT_TTL_MS:-60000}
      THROTTLE_DEFAULT_LIMIT: ${THROTTLE_DEFAULT_LIMIT:-120}
      THROTTLE_AUTH_TTL_MS: ${THROTTLE_AUTH_TTL_MS:-60000}
      THROTTLE_AUTH_LIMIT: ${THROTTLE_AUTH_LIMIT:-15}
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-'self' http://localhost:3000 http://localhost:3001}
      HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS:-63072000}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-resend}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com/emails}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Republik <nao-responda@republik.com.br>}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_PATH: /app/uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.amazonaws.com}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-republik-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      RECOGNIZED_ACADEMIC_DOMAINS: ${RECOGNIZED_ACADEMIC_DOMAINS:-usp.br,alumni.usp.br,ufba.br,uefs.br,ecomp.uefs.br,unicamp.br,dac.unicamp.br,ufmg.br,ufrj.br,unb.br,ufsc.br,edu.br}
      LGPD_CONTROLLER_NAME: ${LGPD_CONTROLLER_NAME:-Republik Tecnologia Universitária Ltda.}
      LGPD_DPO_EMAIL: ${LGPD_DPO_EMAIL:-privacidade@republik.com.br}
      OBSERVE_APP_KEY: ${OBSERVE_APP_KEY:-YOUR_APP_KEY}
      OBSERVE_APP_SECRET: ${OBSERVE_APP_SECRET:-YOUR_APP_SECRET}
      OBSERVE_SERVICE_ID: ${OBSERVE_SERVICE_ID:-republik-backend}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - republik_uploads_data:/app/uploads

  frontend:
    build:
      context: ./republik-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://republik.com.br}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Republik}
        NEXT_PUBLIC_DPO_EMAIL: ${NEXT_PUBLIC_DPO_EMAIL:-privacidade@republik.com.br}
        NEXT_PUBLIC_SUPPORT_WHATSAPP: ${NEXT_PUBLIC_SUPPORT_WHATSAPP:-5511972331902}
        NEXT_PUBLIC_CSRF_COOKIE_NAME: ${NEXT_PUBLIC_CSRF_COOKIE_NAME:-republik_csrf_token}
        NEXT_PUBLIC_CSRF_HEADER_NAME: ${NEXT_PUBLIC_CSRF_HEADER_NAME:-x-csrf-token}
    container_name: republik-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${FRONTEND_PORT:-3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://republik.com.br}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Republik}
      NEXT_PUBLIC_DPO_EMAIL: ${NEXT_PUBLIC_DPO_EMAIL:-privacidade@republik.com.br}
      NEXT_PUBLIC_SUPPORT_WHATSAPP: ${NEXT_PUBLIC_SUPPORT_WHATSAPP:-5511972331902}
      NEXT_PUBLIC_CSRF_COOKIE_NAME: ${NEXT_PUBLIC_CSRF_COOKIE_NAME:-republik_csrf_token}
      NEXT_PUBLIC_CSRF_HEADER_NAME: ${NEXT_PUBLIC_CSRF_HEADER_NAME:-x-csrf-token}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  republik_pg_data:
  republik_uploads_data:
